<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loud Space: live kill map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M0 0h52l12 12v52H12L0 52z' fill='%23d9480f'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='700' font-size='28' text-anchor='middle' fill='%23ffffff'%3ELS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1018; --panel:#121a26; --panel2:#182233; --ink:#dfe6ee; --muted:#8190a3; --line:#243246;
  --accent:#ff7a3d; --hot:#ff4d2e; --gold:#ffc145;
  --sans:"Saira","Segoe UI",system-ui,sans-serif; --cond:"Saira Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.mark{width:40px;height:40px;display:grid;place-items:center;background:#d9480f;color:#fff;font-weight:700;font-size:1.1rem;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.brand b{display:block;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase}
.brand small{color:var(--muted);font-size:.85rem}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--cond);font-size:.92rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:inherit;color:var(--muted);background:var(--panel2);border:0;padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#120a05;font-weight:600}
.tools select,.tbtn{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer}
.tbtn:hover{border-color:var(--accent)}
.tools label{display:flex;align-items:center;gap:6px}
.back{color:#72aef0;text-decoration:none;border:1px solid #2b4a6e;border-radius:3px;padding:5px 10px}
.back:hover{border-color:#72aef0}
.status{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:#3fd27a;box-shadow:0 0 6px #3fd27a;animation:blink 1.6s infinite}
.dot.err{background:var(--hot)}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .dot.live{animation:none} }

main{display:grid;grid-template-columns:1fr 360px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#c2d,#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c2d{cursor:grab}
#c2d.drag{cursor:grabbing}
.tip{position:absolute;pointer-events:none;background:rgba(18,26,38,.92);border:1px solid var(--line);border-radius:3px;padding:3px 8px;font-family:var(--cond);font-size:.85rem;white-space:nowrap;transform:translate(10px,-50%)}
.regstats{position:absolute;left:12px;top:12px;background:rgba(18,26,38,.88);border:1px solid var(--line);border-radius:3px;padding:10px 14px;font-family:var(--cond);font-size:.88rem;min-width:220px;max-width:calc(100% - 24px)}
.regstats h3{margin:0 0 6px;font-family:var(--sans);font-size:1.05rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.regstats dl{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 16px}
.regstats dt{color:var(--muted)}
.regstats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.regstats .grp{grid-column:1/-1;margin-top:6px;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.legend{position:absolute;left:12px;bottom:12px;font-family:var(--cond);font-size:.8rem;color:var(--muted);background:rgba(11,16,24,.75);border:1px solid var(--line);border-radius:3px;padding:6px 10px;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.hint{position:absolute;right:12px;bottom:12px;font-family:var(--cond);font-size:.8rem;color:var(--muted)}
.notice{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-family:var(--cond);max-width:460px;padding:0 16px}

aside{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr;min-height:0}
.feed-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.feed-head h2{margin:0;font-size:1rem;font-weight:600}
.feed-head span{font-family:var(--cond);font-size:.82rem;color:var(--muted)}
#feed{list-style:none;margin:0;padding:0;overflow-y:auto;overflow-anchor:none} /* the page keeps the reader's place itself */
.kill{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden;transition:background-color .2s}
.kill:hover,.kill.sel{background:var(--panel2)}
.kill.enter{animation:grow .5s ease-out}
.kill.flash{animation:grow .5s ease-out,flash 1.6s ease-out}
@keyframes grow{from{max-height:0;opacity:0;padding-top:0;padding-bottom:0}to{max-height:110px;opacity:1}}
@keyframes flash{from{background-color:rgba(255,122,61,.18)}to{background-color:transparent}}
@media (prefers-reduced-motion: reduce){ .kill.enter,.kill.flash{animation:none} }
.k-ship{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-isk{font-family:var(--cond);font-weight:600;font-size:1.05rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.k-isk.big{color:var(--accent)}
.k-isk.huge{color:var(--gold);text-shadow:0 0 8px rgba(255,193,69,.45)}
.k-sub{grid-column:1/-1;font-family:var(--cond);font-size:.88rem;color:var(--ink);display:flex;gap:6px;align-items:center;min-width:0}
.k-sub span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-meta{grid-column:1/-1;font-family:var(--cond);font-size:.8rem;color:var(--muted);white-space:nowrap}
.sec{display:inline-block;min-width:2.4em;text-align:center;padding:0 4px;border-radius:2px;font-weight:600;font-size:.8rem;color:#10161e}
.k-meta a{margin-left:6px}
.empty{padding:16px 14px;color:var(--muted);font-family:var(--cond);overflow-wrap:anywhere}

@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
  aside{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html" title="Back to Loud Space">
    <span class="mark" aria-hidden="true">LS</span>
    <span><b>Live kill map</b><small>Every kill in New Eden as zKillboard reports it</small></span>
  </a>
  <div class="tools">
    <div class="seg" role="group" aria-label="Map view">
      <button type="button" id="v2d" aria-pressed="true">2D</button>
      <button type="button" id="v3d" aria-pressed="false">3D</button>
    </div>
    <label for="regionSel">Region
      <select id="regionSel"><option value="">All regions</option></select>
    </label>
    <label for="minIsk">Show kills over
      <select id="minIsk">
        <option value="0">Any value</option>
        <option value="10000000">10M ISK</option>
        <option value="100000000">100M ISK</option>
        <option value="1000000000">1B ISK</option>
        <option value="10000000000">10B ISK</option>
      </select>
    </label>
    <button class="tbtn" id="pause" type="button" aria-pressed="false">Pause</button>
    <span class="status" id="status" role="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></span>
    <a class="back" href="index.html">Back to the site</a>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="c2d" aria-label="2D map of New Eden with live kills"></canvas>
    <div id="c3d" hidden aria-label="3D map of New Eden with live kills"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="regstats" id="regstats" hidden aria-live="polite"></div>
    <div class="notice" id="notice">Loading the map…</div>
    <div class="legend" aria-hidden="true">
      <span><i style="background:#4ecef8"></i>High sec</span>
      <span><i style="background:#dc6d07"></i>Low sec</span>
      <span><i style="background:#8d3264"></i>Null sec</span>
      <span><i style="background:#ff7a3d"></i>Kill</span>
      <span><i style="background:#ffc145"></i>Kill over 1B ISK</span>
    </div>
    <div class="hint" id="hint">Drag to move, scroll to zoom</div>
  </div>
  <aside aria-label="Kill feed">
    <div class="feed-head"><h2>Kill feed</h2><span id="feedCount">0 kills</span></div>
    <ul id="feed"><li class="empty">Waiting for kills…</li></ul>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  // Development copy: opened as a local file, read the live site's data files.
  const DATA_BASE = location.protocol === "file:" ? "https://lcahst.github.io/quiet-space/data/" : "data/";
  const R2Z2 = "https://r2z2.zkillboard.com/ephemeral";
  const ESI = "https://esi.evetech.net";
  const BACKFILL = 40;          // kills to load from just before "now" when the page opens
  const FEED_MAX = 150;         // entries kept in the feed
  const PULSE_MS = 4500;        // how long a kill flash lasts on the map
  const SEC_COLORS = {"1.0":"#2c75e1","0.9":"#399aeb","0.8":"#4ecef8","0.7":"#60dba3","0.6":"#71e554","0.5":"#f3fd82","0.4":"#dc6d07","0.3":"#ce440f","0.2":"#bb1116","0.1":"#731f1f","0.0":"#8d3264"};
  const POCHVEN = 10000070;

  // ---------- Data ----------
  let galaxy = {}, systems = {}, consToRegion = {}, regions = {}, links = {};
  let regionCenters = []; // [{id, name, x, y, z}] in light years
  let regionFilter = "";   // region ID as a string, or "" for all regions
  const UNREACHABLE = new Set(["10000004", "10000017", "10000019"]); // Jove regions with no gates in
  const regionOfSys = id => { const s = systems[id]; return s ? String(consToRegion[s.c]) : ""; };
  const inRegion = id => !regionFilter || regionOfSys(id) === regionFilter;
  let liveJumps = {}, liveKills = {}, liveAt = null; // ESI last-hour numbers per system
  const typeNames = {};
  const extraSystemNames = {}; // wormhole system names (J123456), looked up as kills arrive
  async function getJSON(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(`${r.status} for ${url}`);
    return r.json();
  }
  function displaySec(s) {
    if (s === undefined || s === null) return null;
    if (s > 0 && s < 0.05) return 0.1;
    return Math.round(s * 10) / 10;
  }
  function secColor(id) {
    const sys = systems[id];
    if (!sys) return "#5f6f82";
    if (consToRegion[sys.c] === POCHVEN) return "#7a2a44";
    const d = displaySec(sys.s);
    return d === null ? "#5f6f82" : SEC_COLORS[d <= 0 ? "0.0" : d.toFixed(1)];
  }
  const fmtIsk = v => !v ? "0" : v >= 1e12 ? (v / 1e12).toFixed(2) + "T" : v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.round(v / 1e3) + "K";

  // Resolve ship type names in small batches.
  const pendingTypes = new Set();
  let typeTimer = null;
  // Wormhole systems aren't in the site's map data; their names come from the same ESI lookup.
  function wantSystem(id) {
    if (!id || id < 31000000 || id >= 32000000 || extraSystemNames[id] || pendingTypes.has(id)) return;
    wantType(id);
  }
  function wantType(id) {
    if (!id || typeNames[id] || extraSystemNames[id] || pendingTypes.has(id)) return;
    pendingTypes.add(id);
    clearTimeout(typeTimer);
    typeTimer = setTimeout(async () => {
      const ids = [...pendingTypes]; pendingTypes.clear();
      try {
        const data = await getJSON(`${ESI}/universe/names/`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ids) });
        data.forEach(d => { if (d.category === "solar_system") extraSystemNames[d.id] = d.name; else typeNames[d.id] = d.name; });
        document.querySelectorAll(".k-ship[data-type]").forEach(el => { const n = typeNames[el.dataset.type]; if (n) el.textContent = n; });
        document.querySelectorAll(".k-where[data-sys]").forEach(el => { const n = extraSystemNames[el.dataset.sys]; if (n) el.textContent = `${n}, Wormhole space`; });
      } catch (e) { /* names stay as type numbers */ }
    }, 400);
  }

  // ---------- Kill feed (zKillboard R2Z2) ----------
  const kills = [];         // newest first
  let seq = null, paused = false, minIsk = 0, selectedId = null;
  function setStatus(text, state) {
    $("statusText").textContent = text;
    $("dot").className = "dot" + (state ? " " + state : "");
  }
  // R2Z2 entries carry the ESI killmail plus zKillboard's "zkb" block; read both tolerantly.
  function parseEntry(d) {
    const km = d.esi || d.killmail || (d.victim ? d : null);
    if (!km || !km.victim) return null;
    const zkb = d.zkb || km.zkb || {};
    return {
      id: d.killmail_id || km.killmail_id,
      time: km.killmail_time ? Date.parse(km.killmail_time) : Date.now(),
      system: km.solar_system_id,
      ship: km.victim.ship_type_id,
      attackers: Array.isArray(km.attackers) ? km.attackers.length : null,
      value: +zkb.totalValue || 0,
      destroyed: +zkb.destroyedValue || 0,
      dropped: +zkb.droppedValue || 0,
      npc: !!zkb.npc
    };
  }
  async function fetchSeq(n) {
    const r = await fetch(`${R2Z2}/${n}.json`, { cache: "no-store" });
    if (r.status === 404) return null;
    if (r.status === 429) { await sleep(5000); return fetchSeq(n); }
    if (!r.ok) throw new Error(`zKillboard answered ${r.status}`);
    return r.json();
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let backfilling = true;
  function addKill(k, fromBackfill) {
    if (!k || !k.id || kills.some(x => x.id === k.id)) return;
    kills.push(k);
    kills.sort((a, b) => b.time - a.time);
    if (kills.length > FEED_MAX) kills.length = FEED_MAX;
    wantType(k.ship);
    wantSystem(k.system);
    if (fromBackfill || backfilling) return; // drawn once when the backfill finishes
    if (visible(k)) { insertKill(k); pulse(k); }
    if (regionFilter && inRegion(k.system)) renderRegionStats();
  }
  async function follow() {
    try {
      setStatus("Connecting to zKillboard…");
      const start = await getJSON(`${R2Z2}/sequence.json`, { cache: "no-store" });
      // sequence.json lags by up to 50 kills; back up a little further to fill the feed.
      let n = Math.max(1, start.sequence - BACKFILL);
      setStatus("Loading recent kills…");
      for (; n <= start.sequence; n++) {
        const d = await fetchSeq(n).catch(() => null);
        if (d) addKill(parseEntry(d), true);
        await sleep(60);
      }
      seq = start.sequence + 1;
      backfilling = false;
      renderFeed();
      setStatus("Live", "live");
      while (true) {
        if (paused) { await sleep(500); continue; }
        const d = await fetchSeq(seq);
        if (d) { addKill(parseEntry(d), false); seq++; await sleep(150); }
        else await sleep(6000); // caught up: wait for new kills
        if (!paused) setStatus("Live", "live");
      }
    } catch (e) {
      setStatus("Feed unavailable", "err");
      $("feed").replaceChildren(Object.assign(document.createElement("li"), {
        className: "empty",
        textContent: `Couldn’t reach zKillboard’s live feed (${e.message}). If this keeps happening, your browser may be blocking it; tell Claude what this message says.`
      }));
    }
  }

  const feedNodes = new Map(); // kill id -> list item
  const visible = k => k.value >= minIsk && inRegion(k.system);
  const agoText = (k, now) => {
    const mins = Math.max(0, Math.round((now - k.time) / 60000));
    return `${mins < 1 ? "just now" : mins < 60 ? mins + "m ago" : Math.round(mins / 60) + "h ago"}${k.attackers ? `, ${k.attackers} attacker${k.attackers === 1 ? "" : "s"}` : ""}`;
  };
  function buildKill(k) {
    const li = document.createElement("li");
    li.className = "kill" + (k.id === selectedId ? " sel" : "");
    li.dataset.id = k.id;
    const ship = document.createElement("div"); ship.className = "k-ship";
    ship.dataset.type = k.ship; ship.textContent = typeNames[k.ship] || `Ship type ${k.ship}`;
    const isk = document.createElement("div");
    isk.className = "k-isk" + (k.value >= 1e10 ? " huge" : k.value >= 1e9 ? " big" : "");
    isk.textContent = `${fmtIsk(k.value)} ISK`;
    isk.title = `ISK lost: ${Math.round(k.value).toLocaleString()} (destroyed ${fmtIsk(k.destroyed)}, dropped ${fmtIsk(k.dropped)})`;
    const sub = document.createElement("div"); sub.className = "k-sub";
    const sys = systems[k.system];
    const chip = document.createElement("span"); chip.className = "sec";
    const ds = sys ? displaySec(sys.s) : null;
    chip.textContent = ds === null ? "?" : ds.toFixed(1); chip.style.background = secColor(k.system);
    if (ds !== null && (ds <= 0.3 || ds >= 0.9)) chip.style.color = "#fff";
    const where = document.createElement("span"); where.className = "k-where";
    if (sys) where.textContent = `${sys.n}, ${regions[consToRegion[sys.c]] || ""}`;
    else if (k.system >= 32000000) { where.textContent = "Abyssal deadspace"; chip.textContent = "AB"; chip.style.background = "#5b3a8c"; chip.style.color = "#fff"; }
    else if (k.system >= 31000000) {
      where.dataset.sys = k.system;
      where.textContent = `${extraSystemNames[k.system] || "Unknown J-space system"}, Wormhole space`;
      chip.textContent = "WH"; chip.style.background = "#3d4f6b"; chip.style.color = "#fff";
    } else where.textContent = `System ${k.system}`;
    sub.append(chip, where);
    const meta = document.createElement("div"); meta.className = "k-meta";
    const ago = document.createElement("span"); ago.className = "k-ago"; ago.textContent = agoText(k, Date.now());
    const a = document.createElement("a"); a.href = `https://zkillboard.com/kill/${k.id}/`; a.target = "_blank"; a.rel = "noopener"; a.textContent = "zKill";
    a.addEventListener("click", e => e.stopPropagation());
    meta.append(ago, a);
    li.append(ship, isk, sub, meta);
    li.tabIndex = 0;
    const go = () => { selectKill(k); };
    li.addEventListener("click", go);
    li.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    feedNodes.set(k.id, li);
    return li;
  }
  function updateCount() {
    const n = kills.filter(visible).length;
    $("feedCount").textContent = `${n} kill${n === 1 ? "" : "s"}`;
  }
  // Full redraw: only when the list is first shown or the value filter changes. No animations.
  function renderFeed() {
    const shown = kills.filter(visible);
    feedNodes.clear();
    const ul = $("feed");
    if (!shown.length) {
      ul.replaceChildren(Object.assign(document.createElement("li"), { className: "empty", textContent: !kills.length ? "Waiting for kills…" : regionFilter ? `No kills in ${regions[regionFilter]} matching this value yet.` : "No kills above this value yet." }));
    } else ul.replaceChildren(...shown.map(buildKill));
    updateCount();
  }
  // A single new kill: slide it in at its place without touching the rest of the list.
  function insertKill(k) {
    const ul = $("feed");
    const empty = ul.querySelector(".empty"); if (empty) empty.remove();
    const shown = kills.filter(visible);
    const idx = shown.findIndex(x => x.id === k.id);
    if (idx < 0) return;
    const li = buildKill(k);
    const next = shown.slice(idx + 1).map(x => feedNodes.get(x.id)).find(Boolean);
    const reading = ul.scrollTop > 8; // the reader has scrolled down: don't move what they're reading
    ul.insertBefore(li, next || null);
    if (reading) ul.scrollTop += li.offsetHeight;
    else li.classList.add(idx === 0 ? "flash" : "enter");
    li.addEventListener("animationend", () => li.classList.remove("enter", "flash"), { once: true });
    // Drop anything that fell off the end of the list
    const keep = new Set(shown.map(x => x.id));
    for (const [id, node] of feedNodes) if (!keep.has(id)) { node.remove(); feedNodes.delete(id); }
    updateCount();
  }
  function selectKill(k) {
    const old = selectedId !== null && feedNodes.get(selectedId);
    if (old) old.classList.remove("sel");
    selectedId = k.id;
    const li = feedNodes.get(k.id); if (li) li.classList.add("sel");
    flyTo(k.system);
  }
  // Keep "minutes ago" fresh in place.
  setInterval(() => {
    const now = Date.now();
    for (const k of kills) { const li = feedNodes.get(k.id); if (li) li.querySelector(".k-ago").textContent = agoText(k, now); }
  }, 30000);

  // ---------- Map: shared ----------
  let mode = "2d";
  const pulses = [];        // {system, value, start}
  let bounds = null;
  function pulse(k) {
    if (!galaxy[k.system] || !inRegion(k.system)) return;
    pulses.push({ system: k.system, value: k.value, start: performance.now() });
    if (mode === "3d") add3dPulse(k);
  }

  $("minIsk").addEventListener("change", e => { minIsk = +e.target.value; renderFeed(); });
  $("regionSel").addEventListener("change", e => setRegion(e.target.value));
  $("pause").addEventListener("click", () => {
    paused = !paused;
    $("pause").textContent = paused ? "Resume" : "Pause";
    $("pause").setAttribute("aria-pressed", String(paused));
    setStatus(paused ? "Paused" : "Live", paused ? "" : "live");
  });
  window.addEventListener("resize", () => { if (mode === "2d") resize2d(); else resize3d(); });

  // ---------- Start ----------
  (async () => {
    try {
      const [g, cat, md] = await Promise.all([getJSON(DATA_BASE + "galaxy.json"), getJSON(DATA_BASE + "catalog.json"), getJSON(DATA_BASE + "mapdata.json")]);
      galaxy = g.pos; systems = cat.systems; consToRegion = cat.consToRegion; regions = cat.regions; links = md.links;
      const sums = {};
      for (const id in galaxy) {
        const sys = systems[id]; if (!sys) continue;
        const reg = consToRegion[sys.c]; if (reg === undefined || !regions[reg]) continue;
        const t = sums[reg] || (sums[reg] = { x: 0, y: 0, z: 0, n: 0 });
        const p = galaxy[id]; t.x += p[0]; t.y += p[1]; t.z += p[2]; t.n++;
      }
      regionCenters = Object.entries(sums).map(([reg, t]) => ({ id: reg, name: regions[reg], x: t.x / t.n, y: t.y / t.n, z: t.z / t.n, n: t.n }))
        .sort((a, b) => b.n - a.n); // bigger regions get first claim on label space
      const ps = Object.values(galaxy);
      bounds = { minX: Math.min(...ps.map(p => p[0])), maxX: Math.max(...ps.map(p => p[0])), minY: Math.min(...ps.map(p => p[1])), maxY: Math.max(...ps.map(p => p[1])), minZ: Math.min(...ps.map(p => p[2])), maxZ: Math.max(...ps.map(p => p[2])) };
      $("notice").hidden = true;
      resize2d(); fit2d();
      requestAnimationFrame(frame);
      populateRegions();
      loadLive();
      setInterval(loadLive, 10 * 60 * 1000); // ESI refreshes these hourly
      follow();
    } catch (e) {
      $("notice").textContent = `Couldn’t load the map data (${e.message}).`;
      setStatus("Map data unavailable", "err");
    }
  })();
})();
</script>
