name: Update data and publish site

on:
  schedule:
    - cron: "17 * * * *"     # every hour: record traffic, refresh averages and patterns
    - cron: "2,32,47 * * * *" # quick runs in between: recent kills, plus traffic if the hourly run missed it
    - cron: "45 11 * * *"    # daily after EVE downtime: rebuild map, station and size data
  push:
    branches: [main]          # republish when you change the site
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild all map and station data from scratch"
        type: boolean
        default: false
      backfill_kills:
        description: "Fill the last 30 days of kills from zKillboard's daily archives (run once; safe to repeat)"
        type: boolean
        default: false

permissions:
  contents: write   # to save the data branch

# Never run two updates at once; they share the data branch.
concurrency:
  group: quiet-space-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: cloudflare
      url: https://quietspace.fun/
    env:
      DATA_DIR: data
    steps:
      - name: Get the site code
        uses: actions/checkout@v5

      - name: Get the saved data (if any)
        run: |
          git clone --quiet --depth 1 --branch data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data \
            || mkdir -p data
          rm -rf data/.git

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build map, station and size data (daily, manual, or first run)
        if: github.event.schedule == '45 11 * * *' || github.event_name == 'workflow_dispatch' || hashFiles('data/public/catalog.json') == ''
        continue-on-error: true
        env:
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: node scripts/build-map.mjs

      # Downloads CCP's static data only when CCP publishes a new build; otherwise reuses its saved result
      - name: Build Advanced search data (daily, manual, or first run)
        if: github.event.schedule == '45 11 * * *' || github.event_name == 'workflow_dispatch' || hashFiles('data/public/search.json') == ''
        continue-on-error: true
        run: node scripts/build-search.mjs

      # Every run, not just the hourly one: GitHub often starts scheduled runs 30-45 minutes late,
      # and ESI's jump data is only served for one hour (it refreshes at about :50), so a late
      # hourly run would miss that hour. The script skips hours it has already recorded.
      - name: Record traffic and update averages and weekly patterns
        continue-on-error: true
        run: node scripts/collect-activity.mjs

      # Manual only: adds kills the saved data doesn't have; the next step then rebuilds the 30-day figures
      - name: Fill the last 30 days of kills from zKillboard's archives (manual option)
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_kills
        continue-on-error: true
        run: node scripts/backfill-kills.mjs

      - name: Record kills and ISK destroyed (zKillboard live feed, every run)
        continue-on-error: true
        run: node scripts/collect-isk.mjs

      - name: Record pirate insurgencies
        if: github.event.schedule != '2,32,47 * * * *'
        continue-on-error: true
        run: node scripts/collect-insurgency.mjs

      - name: Save the faction warfare feed
        if: github.event.schedule != '2,32,47 * * * *'
        continue-on-error: true
        run: node scripts/collect-warzone.mjs

      # Wormhole section: class-level kill figures from the kill log above, and Jita gas and ore prices.
      # The reference data (classes, statics, sites...) is built by hand and committed in wormholes/data;
      # these two files go to the data branch so they survive between runs, with their small caches.
      - name: Update wormhole kill figures and Jita prices
        if: github.event.schedule != '2,32,47 * * * *'
        continue-on-error: true
        env:
          WH_OUT: data/wormholes
          WH_CACHE: data/wormholes-cache
        run: |
          node scripts/wh/collect-wh-kills.mjs
          node scripts/wh/collect-wh-prices.mjs

      # Events section: Jita prices for the current event's turn-in items, tokens and trader shop.
      # The event facts are hand-written and committed in events/data; prices go to the data branch.
      - name: Update event prices
        if: github.event.schedule != '2,32,47 * * * *'
        continue-on-error: true
        env:
          EV_OUT: data/events
          EV_CACHE: data/events-cache
        run: node scripts/events/collect-event-prices.mjs

      - name: Update public player structures (daily, manual, or if missing)
        if: github.event.schedule == '45 11 * * *' || github.event_name == 'workflow_dispatch' || hashFiles('data/public/structures-count.json') == ''
        continue-on-error: true
        run: node scripts/collect-structures.mjs

      - name: Save samples of feeds for upcoming features (daily or manual)
        if: github.event.schedule == '45 11 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/save-samples.mjs

      - name: Save data branch (overwritten each run so it never grows)
        run: |
          cd data
          git init --quiet --initial-branch=data
          git config user.name "quiet-space-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp index.html killmap.html fw.html ships.html fw-guide.html pirate-guide.html _site/
          if [ -d data/public ]; then cp -r data/public/. _site/data/; fi
          mkdir -p _site/wormholes/data
          cp wormholes/*.html wormholes/wh.css wormholes/wh.js _site/wormholes/
          cp wormholes/data/*.json _site/wormholes/data/
          # the latest kill figures and prices from the data branch replace the committed fallback copies
          if [ -d data/wormholes ]; then cp data/wormholes/*.json _site/wormholes/data/; fi
          mkdir -p _site/events/data
          cp events/*.html events/events.css events/events.js _site/events/
          cp events/data/*.json _site/events/data/
          # the latest prices from the data branch replace the committed fallback copy
          if [ -d data/events ]; then cp data/events/*.json _site/events/data/; fi

      # The site is served by Cloudflare at quietspace.fun (site-host/wrangler.jsonc). Retry once if Cloudflare is busy.
      - name: Publish the site to Cloudflare
        working-directory: site-host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy || (sleep 30 && npx --yes wrangler@4 deploy)
