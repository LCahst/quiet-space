<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faction warfare: the frontlines</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M0 0h52l12 12v52H12L0 52z' fill='%23596b86'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='700' font-size='26' text-anchor='middle' fill='%23ffffff'%3EFW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d15; --panel:#101826; --panel2:#162132; --ink:#dfe6ee; --muted:#8392a6; --line:#223146; --accent:#9fb4d4;
  --sans:"Saira","Segoe UI",system-ui,sans-serif; --cond:"Saira Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
a{color:#8fbaf0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.mark{width:40px;height:40px;display:grid;place-items:center;background:#596b86;color:#fff;font-weight:700;font-size:1.05rem;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.brand b{display:block;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase}
.brand small{color:var(--muted);font-size:.85rem}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--cond);font-size:.92rem;color:var(--muted)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.tabs button{font:inherit;font-weight:600;color:var(--muted);background:var(--panel2);border:0;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{color:var(--ink);background:#1e2c42;box-shadow:inset 0 -2px 0 var(--accent)}
.tabs i{display:inline-block;width:10px;height:10px;border-radius:2px}
.tools select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 8px}
.tools label{display:flex;align-items:center;gap:6px;cursor:pointer}
.pbtn{font:inherit;font-weight:600;color:var(--pc,#e6c84a);background:transparent;border:1.5px solid var(--pc,#e6c84a);border-radius:3px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pbtn[aria-pressed="true"]{background:var(--pc,#e6c84a);color:#0b0f16}
.pbtn:disabled{opacity:.4;cursor:default}
.tools select:disabled{opacity:.45}
.seglvl{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.seglvl i{display:inline-block;width:9px;height:6px;border-radius:1px;background:var(--line)}
.back{color:#8fbaf0;text-decoration:none;border:1px solid #2b4a6e;border-radius:3px;padding:5px 10px}
.status{font-size:.82rem}

main{display:grid;grid-template-columns:1fr 360px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.tip{position:absolute;pointer-events:none;background:rgba(14,21,33,.94);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:var(--cond);font-size:.85rem;min-width:200px;max-width:280px;transform:translate(14px,-50%);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip b{font-family:var(--sans);font-size:.98rem}
.tip .row{display:flex;justify-content:space-between;gap:12px}
.tip .row span:first-child{color:var(--muted)}
.notice{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-family:var(--cond);max-width:460px;padding:0 16px}
.legend{position:absolute;left:12px;bottom:12px;pointer-events:none;background:rgba(8,13,21,.82);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:var(--cond);font-size:.8rem;color:var(--muted);display:grid;gap:4px;max-width:calc(100% - 24px)}
.legend .lrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:14px;height:14px}
.heatbar{display:inline-block;width:110px;height:8px;border-radius:4px}
.layers{position:absolute;left:12px;top:10px;margin:0;background:rgba(8,13,21,.82);border:1px solid var(--line);border-radius:4px;padding:4px 10px 6px;font-family:var(--cond);font-size:.85rem;color:var(--muted);display:grid;gap:2px}
.layers legend{padding:0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.layers label{display:flex;align-items:center;gap:6px;cursor:pointer}
.hint{position:absolute;right:12px;top:10px;pointer-events:none;font-family:var(--cond);font-size:.8rem;color:var(--muted);background:rgba(8,13,21,.7);padding:2px 8px;border-radius:3px}

aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 16px 20px;font-family:var(--cond)}
aside h2{font-family:var(--sans);font-size:1rem;font-weight:600;margin:16px 0 8px;letter-spacing:.02em}
aside h2:first-child{margin-top:0}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--panel2);border-radius:4px;padding:8px 10px;border-top:3px solid}
.side .nm{font-family:var(--sans);font-weight:600}
.side .big{font-size:1.5rem;font-weight:600;line-height:1.1}
.side .sub{color:var(--muted);font-size:.82rem}
.share{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:10px 0 2px}
.facts{display:grid;grid-template-columns:auto auto;gap:3px 14px;margin:6px 0 0}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
ol.rank li:first-child{border-top:0}
ol.rank li:hover{background:rgba(255,255,255,.03)}
.r-name{font-weight:500;color:var(--ink)}
.r-sub{grid-column:1/-1;color:var(--muted);font-size:.8rem}
.r-val{text-align:right;font-variant-numeric:tabular-nums}
.pbar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%}
.card{background:var(--panel2);border-radius:4px;padding:10px 12px;margin-top:4px}
.card h3{margin:0;font-family:var(--sans);font-size:1.15rem}
.card .where{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.sharebar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 6px;background:var(--line)}
.sharebar i{display:block;height:100%}
.advrow{display:flex;align-items:baseline;gap:8px;padding:1px 0}
.advrow .sw{width:9px;height:9px;border-radius:2px;flex:none;align-self:center}
.advrow .pc{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.advrow .pts{color:var(--muted);font-size:.8rem;min-width:7.5em;text-align:right}
.net{margin:6px 0 8px;font-weight:700}
.advbars{display:grid;grid-template-columns:5.2em 1fr 3em;gap:2px 8px;align-items:center;margin:6px 0 2px}
.advbars .an{font-weight:500}
.advbars .atrack{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.advbars .atrack i{display:block;height:100%;border-radius:5px}
.advbars .ap{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.advbars .apts{grid-column:2/-1;color:var(--muted);font-size:.75rem;margin:-1px 0 5px}
.adv-h{margin-top:10px}
.backbar{position:sticky;top:-14px;z-index:2;display:flex;justify-content:space-between;align-items:center;margin:-14px -16px 8px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.backbtn{font:inherit;font-weight:600;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 10px;cursor:pointer}
.backbtn:hover{border-color:var(--accent)}
.backbar small{color:var(--muted)}
.prompt{background:var(--panel2);border:1px dashed var(--line);border-radius:4px;padding:8px 10px;color:var(--muted);margin-bottom:6px}
.updated{margin-top:18px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;line-height:1.5}
.updated b{font-weight:600;color:var(--ink)}
.adv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin:4px 0 8px}
.adv .bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.adv .bar i{display:block;height:100%}
.chip{display:inline-block;padding:0 6px;border-radius:2px;font-weight:600;font-size:.8rem;color:#0b1018}
.muted{color:var(--muted)}
.kills-hot{color:#ff5a4a;font-weight:700}
.sortby{display:flex;gap:6px;align-items:center;margin:-4px 0 6px;font-size:.8rem;color:var(--muted)}
.sortby button{font:inherit;color:var(--muted);background:none;border:0;padding:0 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:transparent}
.sortby button:hover{color:var(--ink)}
.sortby button[aria-pressed="true"]{color:var(--ink);font-weight:600;text-decoration-color:var(--accent)}
.empty{color:var(--muted)}

@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:60vh auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  body{overflow:auto}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html" title="Back to Quiet Space">
    <span class="mark" aria-hidden="true">FW</span>
    <span><b>Faction warfare</b><small>The frontlines, who holds what, and where the fighting is</small></span>
  </a>
  <div class="tools">
    <div class="tabs" role="tablist" aria-label="Warzone">
      <button role="tab" id="tab-cg" aria-selected="true"><i style="background:#3f7fd6"></i><i style="background:#2f9e6a"></i>Caldari vs Gallente</button>
      <button role="tab" id="tab-am" aria-selected="false"><i style="background:#d8a22a"></i><i style="background:#b5482f"></i>Amarr vs Minmatar</button>
    </div>
    <label for="overlay">Overlay
      <select id="overlay">
        <option value="">Zones of control only</option>
        <option value="kills1:most">Most kills, last hour</option>
        <option value="kills1:least">Least kills, last hour</option>
        <option value="kills24:most">Most kills, last 24 hours</option>
        <option value="kills24:least">Least kills, last 24 hours</option>
        <option value="jumps:most">Most gate jumps, last hour</option>
        <option value="jumps:least">Least gate jumps, last hour</option>
        <option value="avg:most">Busiest, 30-day average</option>
        <option value="avg:least">Quietest, 30-day average</option>
      </select>
    </label>
    <button type="button" class="pbtn" id="pirateBtn" aria-pressed="false" title="Focus on the pirate insurgency">&#9760; Pirate focus</button>
    <span class="status" id="status" hidden>Loading…</span>
    <a class="back" href="fw-guide.html">FW Guide</a>
    <a class="back" href="ships.html">Ship Stats</a>
    <a class="back" href="index.html">Back to the site</a>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="map" aria-label="Map of the warzone"></canvas>
    <fieldset class="layers">
      <legend>Layers</legend>
      <label><input type="checkbox" id="liveKills" checked> Live kills</label>
      <label><input type="checkbox" id="insurg" checked> Insurgencies</label>
      <label><input type="checkbox" id="routes" checked> Gate routes</label>
      <label><input type="checkbox" id="labels" checked> Names</label>
    </fieldset>
    <div class="tip" id="tip" hidden></div>
    <div class="notice" id="notice">Loading the warzone…</div>
    <div class="legend" id="legend" aria-hidden="true"></div>
    <div class="hint">Drag to move, scroll to zoom, click a system for details</div>
  </div>
  <aside id="panel" aria-label="Warzone details"></aside>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  // Development copy: opened as a local file, read the live site's data files.
  const DATA_BASE = location.protocol === "file:" ? "https://lcahst.github.io/quiet-space/data/" : "data/";
  const ESI = "https://esi.evetech.net";
  const R2Z2 = "https://r2z2.zkillboard.com/ephemeral";
  const FACTIONS = {
    500001: { name: "Caldari State", short: "Caldari", color: "#3f7fd6" },
    500004: { name: "Gallente Federation", short: "Gallente", color: "#2f9e6a" },
    500003: { name: "Amarr Empire", short: "Amarr", color: "#d8a22a" },
    500002: { name: "Minmatar Republic", short: "Minmatar", color: "#b5482f" },
    500010: { name: "Guristas Pirates", short: "Guristas", color: "#e6c84a" },
    500011: { name: "Angel Cartel", short: "Angels", color: "#c2306b" }
  };
  const ZONES = {
    cg: { title: "Caldari vs Gallente", sides: [500001, 500004], pirate: 500010 },
    am: { title: "Amarr vs Minmatar", sides: [500003, 500002], pirate: 500011 }
  };
  const SEC_COLORS = {"1.0":"#2c75e1","0.9":"#399aeb","0.8":"#4ecef8","0.7":"#60dba3","0.6":"#71e554","0.5":"#f3fd82","0.4":"#dc6d07","0.3":"#ce440f","0.2":"#bb1116","0.1":"#731f1f","0.0":"#8d3264"};
  const ROLE_NAMES = { front: "Frontline", command: "Command operations", rear: "Rearguard" };

  // ---------- Data ----------
  let catalog = null, galaxy = {}, links = {}, feed = [], feedAt = null;
  let activity = null, kills24 = null, insurgency = null;
  let jumps1 = {}, kills1 = {}, liveAt = null;
  let prevAmounts = null, prevOccupiers = null, prevAt = null, esiAt = null; // comparison point for "change since the last update"
  const REFRESH_MS = 5 * 60 * 1000;
  const fw = new Map(); // systemId -> { owner, occupier, contested, amount, adv: [{f, terrain, dynamic, total}] }
  async function getJSON(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(`${r.status} for ${url.split("/").pop()}`);
    return r.json();
  }
  const optional = url => getJSON(url, { cache: "no-cache" }).catch(() => null);
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  // Territory shading by role, in the faction's own colour: frontline brightest (and a touch lighter),
  // command in the middle, rearguard dimmer. Gentler when a heat overlay is on so the overlay stays readable.
  const ROLE_FILL = { front: { a: 0.42, heat: 0.17, lighten: 0.18 }, command: { a: 0.27, heat: 0.12, lighten: 0 }, rear: { a: 0.15, heat: 0.07, lighten: 0 } };
  function territoryFill(hex, role, heatOn, boost) {
    const r = ROLE_FILL[role] || ROLE_FILL.command;
    const n = parseInt(hex.slice(1), 16), mix = c => Math.round(c + (255 - c) * r.lighten);
    return `rgba(${mix(n >> 16)},${mix((n >> 8) & 255)},${mix(n & 255)},${(heatOn ? r.heat : r.a) + boost})`;
  }
  function displaySec(s) { if (s === undefined || s === null) return null; if (s > 0 && s < 0.05) return 0.1; return Math.round(s * 10) / 10; }
  const secColor = s => { const d = displaySec(s); return d === null ? "#5f6f82" : SEC_COLORS[d <= 0 ? "0.0" : d.toFixed(1)]; };
  const sysName = id => (catalog.systems[id] ? catalog.systems[id].n : `System ${id}`);
  const regionOf = id => { const s = catalog.systems[id]; return s ? catalog.regions[catalog.consToRegion[s.c]] : ""; };

  // Feed entries: { solarsystemID, ownerFaction, occupierFaction, contestedStatus, contestedAmount, advantage: [{factionID, terrainAmount, dynamicAmount, totalAmount}] }
  function readFeed(list) {
    fw.clear();
    for (const s of list || []) {
      const id = s.solarsystemID ?? s.solarSystemID ?? s.systemId;
      if (typeof id !== "number") continue;
      fw.set(id, {
        owner: s.ownerFaction, occupier: s.occupierFaction,
        contested: String(s.contestedStatus || "").toLowerCase() !== "uncontested",
        status: s.contestedStatus || "",
        amount: Math.max(0, Math.min(1, +s.contestedAmount || 0)),
        adv: (s.advantage || []).map(a => ({ f: a.factionID, terrain: +a.terrainAmount || 0, dynamic: +a.dynamicAmount || 0, total: +a.totalAmount || 0 }))
      });
    }
  }

  // Contested progress straight from ESI (refreshed by ESI every 30 minutes): victory points against the
  // threshold give the same percentage as the Frontlines feed, just more often. Advantage stays hourly.
  async function loadEsiFw() {
    try {
      const r = await fetch(`${ESI}/fw/systems/`, { cache: "no-cache" });
      if (!r.ok) return false;
      const list = await r.json();
      for (const e of list) {
        const s = fw.get(e.solar_system_id);
        if (!s) continue;
        s.owner = e.owner_faction_id; s.occupier = e.occupier_faction_id;
        s.status = e.contested ? e.contested.charAt(0).toUpperCase() + e.contested.slice(1) : s.status;
        s.contested = e.contested !== "uncontested";
        if (e.victory_points_threshold) s.amount = Math.max(0, Math.min(1, e.victory_points / e.victory_points_threshold));
      }
      const lm = r.headers.get("last-modified");
      esiAt = lm ? new Date(lm) : new Date();
      return true;
    } catch (e) { return false; }
  }
  // A system that changed hands since the last update has "flipped" rather than lost progress.
  const flippedSince = id => !!(prevOccupiers && prevOccupiers[id] !== undefined && fw.has(id) && prevOccupiers[id] !== fw.get(id).occupier);
  const deltaOf = id => (prevAmounts && prevAmounts[id] !== undefined && fw.has(id) && !flippedSince(id)) ? fw.get(id).amount - prevAmounts[id] : null;
  const changeText = id => flippedSince(id) ? `Flipped to ${FACTIONS[fw.get(id).occupier] ? FACTIONS[fw.get(id).occupier].short : "?"}` : fmtDelta(deltaOf(id));
  const changeColor = id => flippedSince(id) ? (FACTIONS[fw.get(id).occupier] ? FACTIONS[fw.get(id).occupier].color : "var(--muted)") : deltaColor(id, deltaOf(id));
  function fmtDelta(d) {
    if (d === null) return "";
    const v = Math.round(d * 1000) / 10;
    return v === 0 ? "no change" : `${v > 0 ? "+" : "\u2212"}${Math.abs(v).toFixed(1)}%`;
  }
  // Gains show in the attacker's colour, losses (the defender pushing back) in the defender's.
  function deltaColor(id, d) {
    if (!d) return "var(--muted)";
    const occ = fw.get(id).occupier;
    const f = d > 0 ? enemyOf(zone, occ) : occ;
    return FACTIONS[f] ? FACTIONS[f].color : "var(--muted)";
  }
  const timeOf = d => d ? d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "";
  // Advantage as shares: each faction's total as a share of everyone's combined. Net advantage is the
  // leader's share minus the next strongest faction's share.
  function advantageOf(s) {
    const list = (s.adv || []).filter(a => a.total > 0).sort((a, b) => b.total - a.total);
    const sum = list.reduce((t, a) => t + a.total, 0);
    if (!sum) return null;
    const shares = list.map(a => ({ ...a, share: a.total / sum }));
    const net = shares[0].share - (shares[1] ? shares[1].share : 0);
    return { shares, leader: shares[0].f, net, even: Math.round(net * 100) === 0 };
  }
  const pct0 = v => `${Math.round(v * 100)}%`;

  // ---------- Warzone geometry ----------
  let zoneKey = "cg", zone = null;
  // zone = { ids, set, enemyOf, roles, cells, bounds, neighbours }
  function enemyOf(z, f) { return f === z.sides[0] ? z.sides[1] : z.sides[0]; }
  function buildZone(key) {
    const z = ZONES[key];
    const ids = [...fw.keys()].filter(id => galaxy[id] && (z.sides.includes(fw.get(id).occupier) || z.sides.includes(fw.get(id).owner)));
    const set = new Set(ids);
    // Roles: frontline borders enemy territory; command borders a friendly frontline; the rest are rearguard.
    const roles = new Map();
    ids.forEach(id => {
      const occ = fw.get(id).occupier;
      roles.set(id, (links[id] || []).some(n => set.has(n) && fw.get(n).occupier === enemyOf(z, occ)) ? "front" : null);
    });
    ids.forEach(id => {
      if (roles.get(id)) return;
      const occ = fw.get(id).occupier;
      roles.set(id, (links[id] || []).some(n => set.has(n) && roles.get(n) === "front" && fw.get(n).occupier === occ) ? "command" : "rear");
    });
    // Systems just outside the warzone that connect to it, drawn faintly for context.
    const neighbours = [...new Set(ids.flatMap(id => (links[id] || []).filter(n => !set.has(n) && galaxy[n])))];
    const pts = ids.map(id => galaxy[id]);
    const bounds = { minX: Math.min(...pts.map(p => p[0])), maxX: Math.max(...pts.map(p => p[0])), minZ: Math.min(...pts.map(p => p[2])), maxZ: Math.max(...pts.map(p => p[2])) };
    zone = { key, ...z, ids, set, roles, neighbours, bounds, cells: buildCells(ids, neighbours) };
  }

    const infected = insurgency ? Object.keys(insurgency.systems).map(Number).filter(id => campIds.has(insurgency.systems[id].c) && galaxy[id]) : [];

    // territory: infected systems shaded by corruption in the pirate colour; everything else neutral grey
    for (const [id, poly] of pv.cells) {
      const e = insOf(id), sel = id === selectedId, hov = id === hoverId;
      g.beginPath(); poly.forEach((v, i) => { const [x, y] = S(v.x, v.y); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath();
      g.fillStyle = e ? hexA(pc, 0.1 + ((e.cs || 0) / 5) * 0.5 + (sel ? 0.12 : hov ? 0.06 : 0)) : `rgba(120,135,160,${0.06 + (sel ? 0.1 : hov ? 0.05 : 0)})`;
      g.fill();
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i], b = poly[(i + 1) % poly.length];
        const otherInfected = pv.iset.has(a.e);
        if (e && !otherInfected) { borderEdges.push([a, b]); continue; }   // edge of the infected area
        if (!e && a.e === "cap") { const [x1, y1] = S(a.x, a.y), [x2, y2] = S(b.x, b.y); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = "rgba(150,165,190,0.25)"; g.lineWidth = 1 * dpr; g.stroke(); }
      }
    }
    // gate routes: faint everywhere, bright in the pirate colour between infected systems (the spread network)
    if ($("routes").checked) {
      g.lineCap = "round";
      for (const id of pv.ids) {
        const [x1, y1] = S(...P(id));
        for (const n of links[id] || []) {
          if (!galaxy[n] || (pv.set.has(n) && n < id)) continue;
          const [x2, y2] = S(...P(n));
          const hot = pv.iset.has(id) && pv.iset.has(n);
          g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
          g.setLineDash(pv.set.has(n) ? [] : [4 * dpr, 4 * dpr]);
          g.strokeStyle = "rgba(4,7,12,0.7)"; g.lineWidth = (hot ? 4.2 : 3) * dpr; g.stroke();
          g.strokeStyle = hot ? hexA(pc, 0.95) : "rgba(150,165,190,0.3)"; g.lineWidth = (hot ? 2 : 1) * dpr; g.stroke();
        }
      }
      g.setLineDash([]); g.lineCap = "butt";
    }
    // the spread: a glowing border around the infected area
    if (borderEdges.length) {
      g.save(); g.beginPath();
      for (const [a, b] of borderEdges) { const [x1, y1] = S(a.x, a.y), [x2, y2] = S(b.x, b.y); g.moveTo(x1, y1); g.lineTo(x2, y2); }
      g.lineCap = "round"; g.shadowColor = pc; g.shadowBlur = 14 * dpr; g.strokeStyle = hexA(pc, 0.6); g.lineWidth = 4 * dpr; g.stroke();
      g.shadowBlur = 0; g.strokeStyle = hexA(pc, 0.95); g.lineWidth = 1.4 * dpr; g.stroke();
      g.restore();
    }
    for (const id of pv.neighbours) { const [x, y] = S(...P(id)); g.beginPath(); g.arc(x, y, 2 * dpr, 0, Math.PI * 2); g.fillStyle = "rgba(160,175,200,0.35)"; g.fill(); }
    // markers
    const taken = [], labelOn = $("labels").checked;
    const ordered = pv.ids.slice().sort((a, b) => (pv.iset.has(b) ? 1 : 0) - (pv.iset.has(a) ? 1 : 0)); // infected names get priority
    for (const id of ordered) {
      const e = insOf(id), [x, y] = S(...P(id)), origin = pv.origins.includes(id);
      if (origin) {
        g.save(); g.shadowColor = pc; g.shadowBlur = 18 * dpr;
        g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.lineTo(x + Math.cos(a) * 9 * dpr, y + Math.sin(a) * 9 * dpr); } g.closePath();
        g.fillStyle = pc; g.fill(); g.restore();
        g.strokeStyle = "#fff"; g.lineWidth = 1.5 * dpr; g.stroke();
      }
      if (e) {
        if (!origin) { g.beginPath(); g.arc(x, y, 4.5 * dpr, 0, Math.PI * 2); g.fillStyle = pc; g.fill(); g.strokeStyle = id === selectedId ? "#fff" : "rgba(255,255,255,0.85)"; g.lineWidth = (id === selectedId ? 2.2 : 1.2) * dpr; g.stroke(); }
        segRing(x, y, (origin ? 13 : 9) * dpr, e.cs || 0, pc, 2.6 * dpr);
        segRing(x, y, (origin ? 17 : 13) * dpr, e.ss || 0, SUPPRESS, 2.2 * dpr);
      } else if (!origin) {
        g.beginPath(); g.arc(x, y, 2.6 * dpr, 0, Math.PI * 2); g.fillStyle = "rgba(170,182,200,0.55)"; g.fill();
      }
      if (labelOn) {
        const label = e ? `${sysName(id)}  C${e.cs ?? "?"} S${e.ss ?? "?"}` : sysName(id);
        g.font = `${e ? 12 : 10.5}px "Saira Semi Condensed", sans-serif`.replace(/^(\d+(\.\d+)?)px/, m => (parseFloat(m) * dpr) + "px");
        const off = (e ? (origin ? 20 : 16) : 5) * dpr, w = g.measureText(label).width, bx = x + off, by = y - 7 * dpr, h = 13 * dpr;
        if (!taken.some(t => bx < t[0] + t[2] && bx + w > t[0] && by < t[1] + h && by + h > t[1])) {
          taken.push([bx, by, w + 4 * dpr]);
          g.lineWidth = 3 * dpr; g.strokeStyle = "rgba(5,8,14,0.85)"; g.lineJoin = "round"; g.strokeText(label, bx, y + 4 * dpr);
          g.fillStyle = e ? "rgba(245,240,225,0.95)" : "rgba(170,182,200,0.6)"; g.fillText(label, bx, y + 4 * dpr);
        }
      }
    }
    // live kills
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i], t = (now - p.start) / 4000;
      if (t >= 1 || !pv.set.has(p.system)) { pulses.splice(i, 1); continue; }
      const [x, y] = S(...P(p.system));
      g.beginPath(); g.arc(x, y, (8 + t * 14) * dpr, 0, Math.PI * 2); g.strokeStyle = `rgba(255,140,70,${(1 - t) * 0.9})`; g.lineWidth = 2 * dpr; g.stroke();
    }
  }
  const lvl = (n, color) => `<span class="seglvl">${[0, 1, 2, 3, 4].map(k => `<i style="background:${k < (n || 0) ? color : ""}"></i>`).join("")}</span>`;
  function pirateTip(id, px, py) {
    const tip = $("tip"), e = insOf(id), sysd = catalog.systems[id], d = displaySec(sysd ? sysd.s : null);
    const pc = FACTIONS[zone.pirate].color, row = (a, b) => `<div class="row"><span>${a}</span><span>${b}</span></div>`;
    let html = `<b>${sysName(id)}</b> <span class="chip" style="background:${secColor(sysd && sysd.s)}">${d === null ? "?" : d.toFixed(1)}</span><div class="muted">${regionOf(id)}${pv.origins.includes(id) ? ", campaign origin" : ""}</div>`;
    if (e) {
      html += row("Corruption", `Level ${e.cs ?? "?"}${e.cp != null ? `, ${Math.round(e.cp * 10) / 10}%` : ""}${lvl(e.cs, pc)}`);
      html += row("Suppression", `Level ${e.ss ?? "?"}${e.sp != null ? `, ${Math.round(e.sp * 10) / 10}%` : ""}${lvl(e.ss, SUPPRESS)}`);
    } else html += `<div class="muted">Not part of the insurgency</div>`;
    if (pv.dist.has(id)) html += row("Jumps from origin", pv.dist.get(id));
    html += row("Kills, last hour", (kills1[id] || 0).toLocaleString());
    tip.innerHTML = html; tip.hidden = false;
    const w = $("stage").clientWidth;
    tip.style.left = Math.min(px, w - 300) + "px"; tip.style.top = Math.max(60, py) + "px";
  }
  function renderPiratePanel(panel) {
    const P_ = FACTIONS[zone.pirate], pc = P_.color;
    if (selectedId && pv.set.has(selectedId)) {
      panel.append(backBar());
      const id = selectedId, e = insOf(id), sysd = catalog.systems[id], d = displaySec(sysd ? sysd.s : null);
      const card = el("div", "card");
      const h = el("h3", null, sysName(id) + " "); const chip = el("span", "chip", d === null ? "?" : d.toFixed(1)); chip.style.background = secColor(sysd && sysd.s); h.append(chip);
      card.append(h, el("div", "where", [regionOf(id), pv.origins.includes(id) ? "campaign origin" : ""].filter(Boolean).join(", ")));
      const facts = el("dl", "facts"), fact = (k, v) => { const dd = el("dd"); dd.innerHTML = v; facts.append(el("dt", null, k), dd); };
      if (e) {
        fact("Corruption", `Level ${e.cs ?? "?"} of 5${e.cp != null ? `, ${Math.round(e.cp * 10) / 10}%` : ""}${lvl(e.cs, pc)}`);
        fact("Suppression", `Level ${e.ss ?? "?"} of 5${e.sp != null ? `, ${Math.round(e.sp * 10) / 10}%` : ""}${lvl(e.ss, SUPPRESS)}`);
      } else fact("Insurgency", "Not affected");
      if (pv.dist.has(id)) fact("Jumps from origin", String(pv.dist.get(id)));
      if (fw.has(id)) fact("FW occupier", FACTIONS[fw.get(id).occupier] ? FACTIONS[fw.get(id).occupier].short : "?");
      fact("Kills, last hour", (kills1[id] || 0).toLocaleString());
      card.append(facts);
      panel.append(card);
    }
    if (!(selectedId && pv.set.has(selectedId))) panel.append(el("div", "prompt", "Click a system on the map or in a list to see its corruption and suppression details."));
    panel.append(el("h2", null, `${P_.name} insurgency`));
    if (!pv.camps.length) { panel.append(el("p", "empty", `No active ${P_.short} campaign in this warzone right now.`)); return; }
    for (const c of pv.camps) {
      const facts = el("dl", "facts"), fact = (k, v) => facts.append(el("dt", null, k), el("dd", null, v));
      const mine = [...pv.iset].filter(id => insurgency.systems[id].c === c.id);
      const avg = key => mine.length ? (mine.reduce((t, id) => t + (insurgency.systems[id][key] || 0), 0) / mine.length).toFixed(1) : "?";
      fact("Origin", c.origin ? (catalog.systems[c.origin.id] ? catalog.systems[c.origin.id].n : c.origin.name || "?") : "?");
      if (c.state) fact("State", c.state.charAt(0) + c.state.slice(1).toLowerCase());
      if (c.start) fact("Started", new Date(c.start).toLocaleDateString(undefined, { day: "numeric", month: "short" }));
      fact("Systems affected", String(mine.length));
      fact("Average corruption", `level ${avg("cs")}`);
      fact("Average suppression", `level ${avg("ss")}`);
      fact("Fully corrupted (level 5)", String(mine.filter(id => insurgency.systems[id].cs === 5).length));
      fact("Fully suppressed (level 5)", String(mine.filter(id => insurgency.systems[id].ss === 5).length));
      panel.append(facts);
    }
    const inf = [...pv.iset];
    panel.append(el("h2", null, "Most corrupted"));
    panel.append(rankList(inf.slice().sort((a, b) => (insOf(b).cs - insOf(a).cs) || ((insOf(b).cp || 0) - (insOf(a).cp || 0))).slice(0, 6),
      id => { const e = insOf(id); return { val: `Level ${e.cs}`, sub: `Suppression level ${e.ss ?? "?"}${pv.dist.has(id) ? `, ${pv.dist.get(id)} jump${pv.dist.get(id) === 1 ? "" : "s"} from origin` : ""}`, bar: [(e.cs || 0) / 5, pc] }; }, "No systems affected."));
    panel.append(el("h2", null, "Most suppressed"));
    panel.append(rankList(inf.slice().sort((a, b) => (insOf(b).ss - insOf(a).ss) || ((insOf(b).sp || 0) - (insOf(a).sp || 0))).slice(0, 6),
      id => { const e = insOf(id); return { val: `Level ${e.ss}`, sub: `Corruption level ${e.cs ?? "?"}`, bar: [(e.ss || 0) / 5, SUPPRESS] }; }, "No systems affected."));
    panel.append(el("h2", null, "Furthest spread"));
    const far = inf.filter(id => pv.dist.has(id)).sort((a, b) => pv.dist.get(b) - pv.dist.get(a)).slice(0, 6);
    const maxJ = far.length ? pv.dist.get(far[0]) || 1 : 1;
    panel.append(rankList(far, id => ({ val: `${pv.dist.get(id)} jump${pv.dist.get(id) === 1 ? "" : "s"}`, sub: `Corruption level ${insOf(id).cs ?? "?"}, ${regionOf(id)}`, bar: [pv.dist.get(id) / maxJ, pc] }), "No systems affected."));
    if (insurgency.updated) { const f = el("dl", "facts"); f.append(el("dt", null, "Insurgency data from"), el("dd", null, timeOf(new Date(insurgency.updated)))); panel.append(f); }
  }
  function pirateLegend(lg) {
    const pc = FACTIONS[zone.pirate].color;
    const r = el("div", "lrow");
    r.innerHTML = `<span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="${pc}" stroke-width="2.2" stroke-dasharray="5 2"/></svg>Corruption (segments = level)</span><span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="${SUPPRESS}" stroke-width="2.2" stroke-dasharray="5 2"/></svg>Suppression</span><span><svg viewBox="0 0 14 14"><path d="M7 1l5.2 3v6L7 13l-5.2-3V4z" fill="${pc}" stroke="#fff"/></svg>Origin</span><span><svg viewBox="0 0 14 14"><path d="M1 7h12" stroke="${pc}" stroke-width="2.5"/></svg>Spread border and routes</span><span><svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="2" fill="${hexA(pc, 0.55)}"/></svg>Stronger shade = more corrupted</span>`;
    lg.append(r);
  }
  function updatePirateButton() {
    const btn = $("pirateBtn"), F = FACTIONS[ZONES[zoneKey].pirate];
    btn.style.setProperty("--pc", F.color);
    btn.innerHTML = `&#9760; ${F.short} focus`;
    btn.setAttribute("aria-pressed", String(pirateMode));
    btn.disabled = !insurgency;
    btn.title = insurgency ? `Focus on the ${F.name} insurgency` : "Pirate insurgency data isn't available right now";
    $("overlay").disabled = pirateMode;
  }
  function togglePirate() {
    pirateMode = !pirateMode && !!insurgency;
    selectedId = null; hoverId = null; $("tip").hidden = true;
    if (pirateMode) buildPirateView(); else pv = null;
    updatePirateButton(); fit(); renderPanel(); renderLegend();
  }
  $("pirateBtn").addEventListener("click", togglePirate);

  // ---------- Refresh ----------
  function refreshZone() {
    const keep = { x: view.x, y: view.y, scale: view.scale };
    buildZone(zoneKey);
    if (pirateMode) buildPirateView();
    Object.assign(view, keep);
    if (selectedId && !((pirateMode && pv) ? pv.set : zone.set).has(selectedId)) selectedId = null;
    renderPanel(); renderLegend();
  }
  async function refreshAll() {
    try {
      const wz = await getJSON(DATA_BASE + "warzone.json", { cache: "no-cache" });
      if (wz.updated !== (feedAt && feedAt.toISOString())) {
        feed = wz.feed; feedAt = wz.updated ? new Date(wz.updated) : null;
        prevAmounts = wz.previous ? wz.previous.amounts : null; prevOccupiers = wz.previous ? (wz.previous.occupiers || null) : null; prevAt = wz.previous && wz.previous.updated ? new Date(wz.previous.updated) : null;
        readFeed(feed);
      }
    } catch (e) { /* keep what we have */ }
    await loadEsiFw();
    const k24 = await optional(DATA_BASE + "kills24.json"); if (k24) kills24 = k24;
    refreshZone();
  }

  // ---------- Controls ----------
  function setZone(key) {
    zoneKey = key; selectedId = null; hoverId = null; $("tip").hidden = true;
    $("tab-cg").setAttribute("aria-selected", String(key === "cg"));
    $("tab-am").setAttribute("aria-selected", String(key === "am"));
    buildZone(key);
    if (pirateMode) buildPirateView();
    updatePirateButton();
    fit(); renderPanel(); renderLegend();
  }
  $("tab-cg").addEventListener("click", () => setZone("cg"));
  $("tab-am").addEventListener("click", () => setZone("am"));
  $("overlay").addEventListener("change", renderLegend);
  window.addEventListener("resize", () => { resize(); if (zone) fit(); });

  async function loadLive() {
    try {
      const [j, k] = await Promise.all([getJSON(`${ESI}/universe/system_jumps/`, { cache: "no-cache" }), getJSON(`${ESI}/universe/system_kills/`, { cache: "no-cache" })]);
      jumps1 = {}; kills1 = {};
      j.forEach(r => { jumps1[r.system_id] = r.ship_jumps; });
      k.forEach(r => { kills1[r.system_id] = (r.ship_kills || 0) + (r.pod_kills || 0); });
      liveAt = new Date();
      if (zone) renderPanel();
    } catch (e) { /* overlays that need it just show zeros */ }
  }

  // ---------- Start ----------
  (async () => {
    try {
      const [cat, gal, md, wz] = await Promise.all(["catalog.json", "galaxy.json", "mapdata.json", "warzone.json"].map(n => getJSON(DATA_BASE + n, { cache: "no-cache" })));
      catalog = cat; galaxy = gal.pos; links = md.links;
      feed = wz.feed; feedAt = wz.updated ? new Date(wz.updated) : null;
      prevAmounts = wz.previous ? wz.previous.amounts : null; prevOccupiers = wz.previous ? (wz.previous.occupiers || null) : null; prevAt = wz.previous && wz.previous.updated ? new Date(wz.previous.updated) : null;
      readFeed(feed);
      await loadEsiFw();
      [activity, kills24, insurgency] = await Promise.all([optional(DATA_BASE + "activity.json"), optional(DATA_BASE + "kills24.json"), optional(DATA_BASE + "insurgency.json")]);
      if (insurgency && !(insurgency.updated && Date.now() - Date.parse(insurgency.updated) < 12 * 3600e3)) insurgency = null;
      $("notice").hidden = true;
      $("status").textContent = feedAt ? `Frontlines data from ${feedAt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}` : "";
      resize(); setZone("cg");
      requestAnimationFrame(loop);
      loadLive(); setInterval(loadLive, 10 * 60 * 1000);
      setInterval(refreshAll, REFRESH_MS);
      followKills();
    } catch (e) {
      $("notice").textContent = `Couldn’t load the warzone (${e.message}).`;
      $("status").textContent = "Data unavailable";
    }
  })();
})();
</script>
</body>
</html>
